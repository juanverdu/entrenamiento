<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Entrenamiento</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="web-bridge.js"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: cuaderno de gimnasio — barra de pestañas fija arriba, columnas de fichas que se apilan en móvil */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#131918; --muted:#5A6663; --line:#D3D9D6;
  --accent:#C2342C; --accent-soft:#F6DEDB; --steel:#2D5B88; --steel-soft:#DCE6F0;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --warn:#9A650F; --warn-soft:#F5EAD3;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#181E1D; --sunk:#131817; --ink:#E5EBE9; --muted:#93A09C; --line:#2A3331;
  --accent:#E8574D; --accent-soft:#3A1E1C; --steel:#79A9DA; --steel-soft:#1C2A38;
  --ok:#5CBD83; --ok-soft:#173023; --warn:#E0AA4E; --warn-soft:#33281A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#181E1D; --sunk:#131817; --ink:#E5EBE9; --muted:#93A09C; --line:#2A3331;
  --accent:#E8574D; --accent-soft:#3A1E1C; --steel:#79A9DA; --steel-soft:#1C2A38;
  --ok:#5CBD83; --ok-soft:#173023; --warn:#E0AA4E; --warn-soft:#33281A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0F1312}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h2{font-size:28px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
header.top{background:#0F1312;color:#E5EBE9;border-bottom:1px solid #2A3331;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.gear{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:4px;color:#93A09C;cursor:pointer;flex:none}
.gear:hover,.gear[aria-current="page"]{color:#E5EBE9}.gear[aria-current="page"]{box-shadow:inset 0 -3px 0 #E8574D}
nav.tabs+.gear{margin-left:0}
.brand{font-family:var(--f-display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:10px}
.plate{width:30px;height:30px;border-radius:7px;background:#0F1312;color:#E5EBE9;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:.8;letter-spacing:-.02em;flex:none;box-shadow:0 0 0 1px var(--line)}
.plate::after{content:"";width:16px;height:2.5px;background:#E8574D}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:inherit;opacity:.7;padding:8px 12px;font-family:var(--f-display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-color:var(--accent)}
nav.tabs button:hover{opacity:1}
nav.tabs svg{display:none}
/* Ejercicios plegables */
.ex{scroll-margin-top:90px}
.ex-head{display:grid;grid-template-columns:40px 1fr 20px;gap:12px;align-items:center;width:100%;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;color:inherit}
.ex-meta{display:grid;gap:2px;min-width:0}
.ex-status{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--sunk);border:1.5px solid var(--line);color:var(--muted)}
.ex.open .ex-status{border-color:var(--accent);color:var(--accent)}
.ex.complete .ex-status{background:var(--ok);border-color:var(--ok);color:#fff;font-size:17px}
.ex.complete:not(.open) .ex-name{color:var(--muted)}
.chev{color:var(--muted)}
.ex.open .chev{transform:rotate(180deg)}
/* Menú semanal en fichas */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.wday{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--sunk);align-content:start}
.wday.now{border-color:var(--accent);background:var(--surface)}
.wmeal{display:grid;gap:1px;font-size:14px}
.plan-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.plan-line:last-child{border-bottom:0}
.qlabel{width:78px}
.pr{color:var(--ok);font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.04em}
.glasses{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.glasses i{height:22px;border-radius:3px;background:var(--line)}
.glasses i.on{background:var(--steel)}
.mus{display:grid;gap:9px}
.mrow{display:grid;grid-template-columns:118px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.mtrack{position:relative;height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.mtrack .band{position:absolute;top:0;bottom:0;background:var(--ok-soft)}
.mtrack .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--warn)}
.mtrack .fill.ok{background:var(--ok)}
.mtrack .fill.hi{background:var(--steel)}
.mrow .v{font-family:var(--f-mono);text-align:right}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px 18px}
.sumgrid .stat b{font-size:18px}
.delta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.advice{padding:10px 12px;border-radius:var(--r);background:var(--steel-soft);color:var(--steel);font-size:14px}
.advice.warn{background:var(--warn-soft);color:var(--warn)}
.est-note{font-size:13px;color:var(--steel)}
.ready{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.rq{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.rq span{display:block;font-size:12px}
.scale{display:flex;gap:5px}
.scale button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);cursor:pointer;color:var(--ink)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ready-done{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--steel-soft);color:var(--steel);font-size:14px}
.ready-done.low{background:var(--warn-soft);color:var(--warn)}
.ready-done.high{background:var(--ok-soft);color:var(--ok)}
.warm{font-size:13px;padding:6px 10px;border-radius:var(--r);border:1px dashed var(--line);color:var(--muted)}
.warm b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.swaps{display:grid;gap:6px;padding:10px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.swaps .btn{text-align:left}
.swapped{font-size:12px;color:var(--steel)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:8px}
.badge{display:grid;gap:2px;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);font-size:13px}
.badge b{font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.badge span{font-size:12px;color:var(--muted)}
.badge.got{background:var(--ok-soft);border-color:transparent}
.badge.got b{color:var(--ok)}
.badge:not(.got) b{color:var(--muted)}
.streaks{display:flex;flex-wrap:wrap;gap:8px}
.photo-btn{position:relative;overflow:hidden}
.confirm{display:grid;gap:10px;padding:12px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent)}
.confirm p{font-size:14px}
.finish-row{display:flex;justify-content:flex-end}
.done-list{display:grid;gap:6px}
.done-list div{display:grid;gap:1px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.done-list div:last-child{border-bottom:0}
.cardio-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.cardio-line:last-of-type{border-bottom:0}
.cprev{font-family:var(--f-mono);font-size:13px;color:var(--steel)}
.prod{display:grid;gap:4px;padding:12px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.prod b{font-size:16px}
.prod .m{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ps-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.ps-row input{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-family:var(--f-mono);font-size:16px}
.ps-other summary{cursor:pointer;font-size:13px;color:var(--steel);padding:4px 0}
.mach{display:grid;grid-template-columns:1fr;gap:8px;align-items:center}
.mach img{width:100%;height:200px;object-fit:cover;border-radius:var(--r);background:var(--sunk);cursor:zoom-in;max-width:100%}
.mach.big{grid-template-columns:1fr}
.mach.big img{width:100%;height:auto;max-height:65vh;object-fit:contain;cursor:zoom-out}
.mach-info{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pl-actions{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.chip.skip{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:700px){.rq{grid-template-columns:1fr}.scale button{width:44px;height:44px}}
@media (max-width:700px){.mrow{grid-template-columns:96px 1fr 40px}.sumgrid{grid-template-columns:1fr 1fr}.sumgrid .stat{min-width:0}}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:360px}
.wd{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.wd i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--sunk);border:1.5px solid var(--line)}
.wd.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.wd.today span{color:var(--accent)}
.wd.today i{border-color:var(--accent)}
.wd.fut i{opacity:.5}

/* ===== Móvil ===== */
@media (max-width:700px){
  header.top{position:static}
  header.top .wrap{padding-block:9px}
  .brand{font-size:20px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;width:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:0;overflow:visible;
    background:var(--surface);color:var(--muted);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(0 0 0 / .06);
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px 2px;border:0;border-top:3px solid transparent;opacity:1;
    font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}
  nav.tabs button[aria-selected="true"] svg{color:var(--accent)}
  nav.tabs svg{display:block;width:24px;height:24px}
  header.top .gear{margin-left:auto}
  main{padding-block:14px calc(160px + env(safe-area-inset-bottom,0px))}
  section.panel{gap:14px}
  .card{padding:14px;gap:12px}
  .grid2,.grid3{gap:14px}
  h2{font-size:24px}
  .day-strip{gap:10px 20px}
  .day-strip .big{font-size:42px}
  .stat b{font-size:17px}
  .session-title{font-size:36px}
  .session-head .field{width:100%}
  .ex{scroll-margin-top:12px}
  .ex-head{min-height:52px}
  .set{grid-template-columns:24px 1fr 1fr 54px;gap:8px}
  .set input{height:50px;font-size:19px}
  .set .tick{height:50px;font-size:20px}
  .btn{min-height:44px}
  .btn.small{min-height:38px;padding:6px 12px}
  .field input,.field select,.field textarea{font-size:16px;min-height:44px}
  .qlabel{width:100%}
  .toast{top:calc(12px + env(safe-area-inset-top,0px))}
  .logline{grid-template-columns:1fr auto}
  .logline > :last-child:empty{display:none}
}

main{padding-block:22px 110px}
section.panel{display:grid;gap:18px}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:var(--r);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* Franja del día */
.day-strip{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:end}
.day-strip .big{font-family:var(--f-display);font-size:52px;font-weight:800;text-transform:uppercase;line-height:.95}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:500;background:var(--sunk);border:1px solid var(--line)}
.chip.due{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.info{background:var(--steel-soft);color:var(--steel);border-color:transparent}

/* Botones y formularios */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}
.btn.armed{background:var(--accent);color:#fff;border-color:var(--accent)}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.field textarea{resize:vertical;min-height:60px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

/* Sesión */
.session-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end}
.session-title{font-family:var(--f-display);font-size:42px;font-weight:800;text-transform:uppercase;line-height:1}
.ex{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.ex:first-of-type{border-top:0;padding-top:0}
.ex-top{display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.ex-name{font-weight:600;font-size:16px}
.presc{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hint{font-size:13px;padding:6px 10px;border-radius:var(--r);background:var(--steel-soft);color:var(--steel)}
.hint.up{background:var(--ok-soft);color:var(--ok)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.set .n{font-family:var(--f-mono);color:var(--muted);font-size:13px;text-align:center}

.set input::placeholder{color:var(--muted);opacity:.6}
.set input{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);font-family:var(--f-mono);text-align:center}
.set .tick{height:38px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.set.done input{background:var(--ok-soft);border-color:transparent}
.set.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.set-head{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.progress-bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress-bar i{display:block;height:100%;background:var(--accent)}

/* Temporizador */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 20px;display:flex;gap:14px;align-items:center;z-index:20;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.timer .t{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.timer button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600}
.timer.zero .t{color:var(--accent)}
.timer button{white-space:nowrap}
@media (max-width:700px){
  .timer{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;justify-content:space-between;border-radius:14px;padding:8px 8px 8px 16px;gap:10px}
  .timer .label{display:none}
  .timer .t{font-size:26px;margin-right:auto}
  .timer button{padding:10px 14px;min-height:44px}
}

/* Tablas */
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
tr.now td{background:var(--accent-soft)}

/* Comida */
.macro-bars{display:grid;gap:10px}
.mbar{display:grid;grid-template-columns:72px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.mbar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative}
.mbar .track i{position:absolute;inset:0 auto 0 0;background:var(--steel);border-radius:5px}
.mbar .track i.over{background:var(--accent)}
.mbar .v{font-family:var(--f-mono);text-align:right}

.empty{padding:26px 16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted);font-size:14px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);background:var(--sunk)}

input[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;text-align:left;line-height:1.3;font:inherit;color:var(--ink)}

function toast(msg){const t=$('#toastSlot');t.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>t.innerHTML='',2600)}

async function initStore(){
  try{ if(window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){ db=null }
  if(!db){ S.mode='local'; render(); return; }
  S.mode='db';
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{o[d.id]=JSON.parse(JSON.stringify(d.data()||{}))});
      if(c==='profile'){ S.profile={...DEFAULT_PROFILE, ...(o.main||{})}; registerCustom(); }
      else if(c==='workouts'){ const keep={}; for(const id in dirty){ if(S.workouts[id]) keep[id]=S.workouts[id] } S.workouts={...o,...keep}; }
      else S[c]=o;
      S.loaded[c]=true; scheduleRender();
    }, err=>{ S.loaded[c]=true; toast('No se pudieron leer los datos: '+(err.message||err.code)); scheduleRender(); });
  });
  try{ assets = await window.claude.use('assets'); }catch(e){ assets=null }
  scheduleRender();
}
async function put(col,id,data){
  if(col==='profile'){ S.profile={...DEFAULT_PROFILE,...data}; registerCustom(); } else S[col][id]=data;
  scheduleRender();
  if(S.mode==='db'){ try{ await db.collection(col).doc(id).set(data) }catch(e){ toast('No se pudo guardar: '+(e.message||e.code)) } }
}
async function del(col,id){
  delete S[col][id]; scheduleRender();
  if(S.mode==='db'){ try{ await db.collection(col).doc(id).delete() }catch(e){ toast('No se pudo borrar: '+(e.message||e.code)) } }
}
const saveTimers={}, dirty={}, inflight={};
/* Los cambios locales mandan hasta que el servidor confirma el guardado: así una copia antigua nunca pisa lo que acabas de escribir */
function putLater(col,id){ dirty[id]=(dirty[id]||0)+1; clearTimeout(saveTimers[id]); saveTimers[id]=setTimeout(()=>flush(col,id),400) }
function flush(col,id){
  inflight[id]=(inflight[id]||Promise.resolve()).then(async()=>{
    const seq=dirty[id]; const cur=S[col][id]; if(!cur){ delete dirty[id]; return }
    const data=JSON.parse(JSON.stringify(cur));
    if(S.mode==='db'){ try{ await db.collection(col).doc(id).set(data) }catch(e){ toast('No se pudo guardar: '+(e.message||e.code)); return } }
    if(dirty[id]===seq) delete dirty[id];
  });
  return inflight[id];
}

/* ============ LÓGICA DEL PROGRAMA ============ */
function weekInfo(date=today()){
  const d = Math.max(0, dayDiff(S.profile.start, date));
  const wk = Math.floor(d/7);
  const c = CYCLE[wk%6];
  return {wk:wk+1, inCycle:(wk%6)+1, block:Math.floor(wk/6)+1, ...c};
}
function workoutsSorted(){ return Object.entries(S.workouts).map(([id,w])=>({id,...w})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.updatedAt||0)-(b.updatedAt||0)) }
function hasDone(w){ return Object.values(w.sets||{}).some(arr=>arr.some(s=>s.done)) }
function todayWorkout(){ return workoutsSorted().filter(w=>w.date===today() && isPlan(w.session) && hasDone(w)).pop() || null }
function nextSessionId(){
  const past = workoutsSorted().filter(w=>w.date<today() && isPlan(w.session) && hasDone(w));
  if(!past.length) return 'EB';
  const last = past[past.length-1].session;
  const i = SESSIONS.findIndex(s=>s.id===last);
  return SESSIONS[(i+1)%SESSIONS.length].id;
}
function currentSessionId(){ const tw=todayWorkout(); if(selSession) return selSession; return tw?tw.session:nextSessionId() }
function setsFor(ex, wi){ return wi.deload ? Math.max(1,Math.ceil(ex.sets/2)) : ex.sets }
function lastPerf(exId, beforeId){
  const list = workoutsSorted().filter(w=>w.id!==beforeId && w.sets && w.sets[exId] && w.sets[exId].some(s=>s.done&&!s.warm));
  return list.length? {date:list[list.length-1].date, sets:list[list.length-1].sets[exId].filter(s=>s.done&&!s.warm)} : null;
}
function suggestion(ex, wi, wid){
  const lp = lastPerf(ex.id, wid);
  const u = ex.unit==='s'?'s':' reps';
  if(!lp) return {kg:null, text:ex.unit==='s'?`Primera vez: aguanta ${ex.lo}–${ex.hi} s con buena postura.`:`Primera vez: elige un peso con el que llegues a ${ex.hi} reps dejando ${wi.rir} en recámara.`, up:false};
  const kgs = lp.sets.map(s=>num(s.kg)).filter(v=>v!=null);
  const top = kgs.length?Math.max(...kgs):null;
  const allTop = lp.sets.length>=1 && lp.sets.every(s=>(num(s.reps)||0)>=ex.hi);
  const resume = lp.sets.map(s=>(s.reps||'?')).join('/')+(top!=null?` @ ${fmtN(top)} kg`:'');
  if(ex.unit==='s'){ return {kg:null, text:`Última vez (${fmtDate(lp.date)}): ${resume} s. ${allTop?'Añade 5 s o lastre.':'Busca unos segundos más.'}`, up:allTop} }
  if(wi.deload){ return {kg: top!=null?Math.round(top*0.9/ex.inc)*ex.inc:null, text:`Descarga: ${top!=null?fmtN(Math.round(top*0.9/ex.inc)*ex.inc)+' kg':'mismo ejercicio'} y sin apurar las series.`, up:false} }
  if(allTop && top!=null) return {kg: top+ex.inc, text:`Última vez (${fmtDate(lp.date)}): ${resume}. Llegaste arriba del rango: sube a ${fmtN(top+ex.inc)} kg y vuelve a ${ex.lo}${u}.`, up:true};
  return {kg: top, text:`Última vez (${fmtDate(lp.date)}): ${resume}. Mantén ${top!=null?fmtN(top)+' kg':'la carga'} y suma 1 rep donde puedas.`, up:false};
}
/* Valor en gris: lo que hiciste en esa misma serie la última vez; si es la primera vez, el peso de tu serie anterior de hoy */
function ghost(e, arr, i, lp, f){
  if(lp && lp.sets.length){ const p=lp.sets[Math.min(i,lp.sets.length-1)]; if(p && p[f]) return String(p[f]) }
  if(f==='kg'){ for(let j=i-1;j>=0;j--){ if(arr[j]&&arr[j].kg) return String(arr[j].kg) } return '' }
  return String(e.hi);
}
function getWorkout(sid, create){
  const id = today()+'_'+sid;
  if(!S.workouts[id] && create){
    const wi = weekInfo(); const ses = SESSIONS.find(s=>s.id===sid); const sets={};
    ses.ex.forEach(e=>{ sets[e.id]=Array.from({length:setsToday(e,wi)},()=>({kg:'', reps:'', done:false})) });
    S.workouts[id]={date:today(), session:sid, week:wi.wk, sets, updatedAt:Date.now()};
  }
  return S.workouts[id]? {id, w:S.workouts[id]} : {id, w:null};
}
function e1rm(kg,reps){ return kg*(1+reps/30) }

function avg7(points){ // points sorted {x(date str), y}
  return points.map(p=>{ const win=points.filter(q=>q.d<=p.d && dayDiff(q.d,p.d)<=6); return {d:p.d, y:win.reduce((a,b)=>a+b.y,0)/win.length} });
}
function weightPoints(){ return Object.values(S.weights).filter(w=>w.kg).map(w=>({d:w.date, y:w.kg})).sort((a,b)=>a.d<b.d?-1:1) }
function navyBF(waist,neck,h){ if(!waist||!neck||!h||waist<=neck) return null; return 495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(h))-450 }
function measureList(){ return Object.values(S.measures).sort((a,b)=>a.date<b.date?-1:1) }
function lastDate(col){ const ds=Object.values(S[col]).map(x=>x.date).filter(Boolean).sort(); return ds.length?ds[ds.length-1]:null }
function mealsOn(date){ return Object.entries(S.meals).map(([id,m])=>({id,...m})).filter(m=>m.date===date).sort((a,b)=>SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot)||(a.at||0)-(b.at||0)) }
function isTrainDay(date){ return Object.values(S.workouts).some(w=>w.date===date && hasDone(w)) }
function age(){ const b=parseISO(S.profile.birth), t=new Date(); let a=t.getFullYear()-b.getFullYear(); if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--; return a }

/* ============ GRÁFICAS SVG ============ */
function niceStep(x){ const e=Math.pow(10,Math.floor(Math.log10(x))); const f=x/e; return (f<1.5?1:f<3?2:f<7?5:10)*e }
function lineChart({series, unit='', empty, h=230, marks=[]}){
  const pts = series.flatMap(s=>s.points);
  if(pts.length<2) return `<div class="empty">${empty}</div>`;
  const W=640,H=h,L=46,R=58,T=16,B=30;
  const xs=pts.map(p=>parseISO(p.d).getTime()); let x0=Math.min(...xs), x1=Math.max(...xs); if(x0===x1){x0-=86400000*3;x1+=86400000*3}
  const ys=pts.map(p=>p.y); let y0=Math.min(...ys), y1=Math.max(...ys); const sp=(y1-y0)||Math.max(1,Math.abs(y1)*0.05);
  y0-=sp*0.2; y1+=sp*0.2;
  const step=niceStep((y1-y0)/4); const ticks=[]; for(let v=Math.ceil(y0/step)*step; v<=y1+1e-9; v+=step) ticks.push(+v.toFixed(6));
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R), sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='<g class="grid">'+ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${sy(t).toFixed(1)}" y2="${sy(t).toFixed(1)}"/>`).join('')+'</g>';
  g+=ticks.map(t=>`<text x="${L-8}" y="${(sy(t)+4).toFixed(1)}" text-anchor="end">${fmtN(t)}</text>`).join('');
  marks.forEach(m=>{ const x=parseISO(m.d).getTime(); if(x>=x0&&x<=x1){ const X=sx(x).toFixed(1); g+=`<line x1="${X}" x2="${X}" y1="${T}" y2="${H-B}" stroke="var(--steel)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${(+X+5).toFixed(1)}" y="${T+11}" style="fill:var(--steel)">${esc(m.label)}</text>` } });
  const xt=[x0,(x0+x1)/2,x1]; g+=xt.map((x,i)=>`<text x="${sx(x).toFixed(1)}" y="${H-8}" text-anchor="${i===0?'start':i===2?'end':'middle'}">${fmtDate(iso(new Date(x)))}</text>`).join('');
  series.forEach(s=>{
    const P=s.points.map(p=>[sx(parseISO(p.d).getTime()),sy(p.y),p.y]);
    if(!P.length) return;
    if(s.area && P.length>1){ g+=`<path d="M${P[0][0]},${H-B} ${P.map(p=>'L'+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')} L${P[P.length-1][0]},${H-B} Z" fill="${s.color}" fill-opacity=".09" stroke="none"/>` }
    if(s.dots) g+=P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${s.color}" fill-opacity=".45"/>`).join('');
    if(s.line && P.length>1) g+=`<path d="${P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    if(s.end){ const e=P[P.length-1]; g+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="4.5" fill="${s.color}"/><text class="endlabel" x="${(e[0]+8).toFixed(1)}" y="${(e[1]+4).toFixed(1)}">${fmtN(e[2])}${unit}</text>` }
  });
  const leg = series.filter(s=>s.name).map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>${leg?`<div class="legend">${leg}</div>`:''}`;
}
function barChart(days){ // [{d, kcal, target}]
  if(!days.some(x=>x.kcal>0)) return `<div class="empty">Cuando registres comidas verás aquí tus calorías de los últimos 14 días frente al objetivo.</div>`;
  const W=640,H=210,L=46,R=10,T=14,B=30; const max=Math.max(3000,...days.map(x=>Math.max(x.kcal,x.target)))*1.05;
  const step=niceStep(max/4); const ticks=[]; for(let v=0;v<=max;v+=step) ticks.push(v);
  const bw=(W-L-R)/days.length; const sy=y=>T+(1-y/max)*(H-T-B);
  let g='<g class="grid">'+ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${sy(t).toFixed(1)}" y2="${sy(t).toFixed(1)}"/>`).join('')+'</g>';
  g+=ticks.map(t=>`<text x="${L-8}" y="${(sy(t)+4).toFixed(1)}" text-anchor="end">${fmtN(t,0)}</text>`).join('');
  days.forEach((x,i)=>{ const cx=L+i*bw; const over=x.kcal>x.target*1.08;
    if(x.kcal>0) g+=`<rect x="${(cx+bw*.18).toFixed(1)}" y="${sy(x.kcal).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${(sy(0)-sy(x.kcal)).toFixed(1)}" rx="2" fill="${over?'var(--accent)':'var(--steel)'}"/>`;
    g+=`<line x1="${(cx+bw*.08).toFixed(1)}" x2="${(cx+bw*.92).toFixed(1)}" y1="${sy(x.target).toFixed(1)}" y2="${sy(x.target).toFixed(1)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 2"/>`;
    if(i%2===0||days.length<8) g+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${parseISO(x.d).getDate()}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div><div class="legend"><span><i style="background:var(--steel)"></i>Dentro del objetivo</span><span><i style="background:var(--accent)"></i>Más de un 8 % por encima</span><span><i style="background:var(--ink)"></i>Objetivo del día</span></div>`;
}

/* Tendencia de peso: recta ajustada a las pesadas de las últimas 4 semanas (resiste pesadas sueltas altas o bajas) */
function weightTrend(days=28){ const pts=weightPoints().filter(p=>dayDiff(p.d,today())<=days);

  const xs=pts.map(p=>dayDiff(pts[0].d,p.d)), ys=pts.map(p=>p.y), n=pts.length, mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;

  return {rate:b*7, now:a+b*dayDiff(pts[0].d,today()), from:pts[0].d, at:d=>a+b*dayDiff(pts[0].d,d), n} }

const CARDIO={cinta:'Cinta',caminar:'Caminar (fuera)',bici:'Bici estática',eliptica:'Elíptica',remo:'Remo (máquina)',otro:'Otro'};
const LEVELS=['Suave','Moderada','Intensa'];

/* Cinta y caminar: ecuaciones del ACSM (andar hasta 7,5 km/h, correr por encima). Resto: METs del Compendium. */
function cardioCalc(c){ const kg=lastWeightKg(), h=(num(S.profile.height)||175)/100, min=num(c.min)||0;

    const v=c.type==='cinta'?(num(c.speed)||5):(num(c.km)&&min?num(c.km)/(min/60):5); const g=c.type==='cinta'?(num(c.incline)||0)/100:0;

{"descripcion": "qué hay en el plato con cantidades aproximadas, en una frase", "kcal": número entero, "p": gramos de proteína (entero), "c": gramos de carbohidratos (entero), "f": gramos de grasa (entero), "nota": "en una frase corta, qué has supuesto"}`:`Eres nutricionista deportivo en España. Estima las calorías y macronutrientes de esta comida tal y como la describe el usuario. Si no da cantidades, supón raciones normales de un adulto en España. Si dice "en crudo" o da pesos, úsalos.

Comida: ${text}`;
  try{ const r=await sample.json(prompt,image?{modelTier:'default',images:[image]}:{modelTier:'default'}); const n=v=>{const x=Math.round(Number(v));return isFinite(x)&&x>=0?x:null};
    const o={kcal:n(r&&r.kcal),p:n(r&&r.p),c:n(r&&r.c),f:n(r&&r.f),nota:r&&typeof r.nota==='string'?r.nota.slice(0,200):'', desc:r&&typeof r.descripcion==='string'?r.descripcion.slice(0,300):''};

    toast(c==='not_granted'?(((window.NATIVE_APP||window.WEB_APP)&&e.message)||'Necesitas permitir que la app consulte a Claude para calcular calorías.'):c==='rate_limited'?'Demasiadas consultas seguidas. Espera un poco y vuelve a probar.':c==='refused'?'No he podido calcular esa comida.':'No se pudo calcular ahora. Vuelve a probar en un momento.'); return null }

function creaStart(){ const ds=Object.values(S.daily).filter(x=>x.creatine).map(x=>x.date).sort(); return ds[0]||null }
function creaStreak(){ let n=0, d=today(); if(!(S.daily[d]&&S.daily[d].creatine)) d=addDays(d,-1); while(S.daily[d]&&S.daily[d].creatine){ n++; d=addDays(d,-1) } return n }
function creaBlock(){
  const t=today(), on=!!(S.daily[t]&&S.daily[t].creatine), st=creaStreak(), cs=creaStart();
  return `<div class="row between" style="background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px">
    <div><div class="label">Creatina monohidrato · 5 g al día</div><div style="font-size:13px" class="muted">${cs?`Desde el ${fmtDate(cs)}${st?` · ${st} día${st===1?'':'s'} seguido${st===1?'':'s'}`:''}`:'Márcala el día que empieces'}</div></div>
    <button class="btn ${on?'':'primary'}" data-act="creatina" aria-pressed="${on}">${on?'✓ Tomada hoy':'Marcar tomada'}</button></div>`;
}
function reminders(){
  const t=today(), out=[];
  const lw=lastDate('weights'), lm=lastDate('measures'), lp=lastDate('photos');
  if(lw===t) out.push(`<span class="chip ok">Peso de hoy registrado</span>`);
  else out.push(`<span class="chip due">Pésate hoy en ayunas</span>`);
  const md = lm? 14-dayDiff(lm,t) : 0;
  out.push(md<=0?`<span class="chip due">Toca medidas</span>`:`<span class="chip">Medidas en ${md} día${md===1?'':'s'}</span>`);
  const pd = lp? 14-dayDiff(lp,t) : 0;
  out.push(pd<=0?`<span class="chip due">Toca fotos de progreso</span>`:`<span class="chip">Fotos en ${pd} día${pd===1?'':'s'}</span>`);
  return out.join('');
}
function macroBars(tot, tg){
  const row=(lab,v,t,u)=>{const pct=Math.min(100,t?v/t*100:0);return `<div class="mbar"><span>${lab}</span><div class="track"><i class="${v>t*1.08?'over':''}" style="width:${pct.toFixed(0)}%"></i></div><span class="v">${fmtN(v,0)} / ${fmtN(t,0)}${u}</span></div>`};
  return `<div class="macro-bars">${row('Calorías',tot.kcal,tg.kcal,'')}${row('Proteína',tot.p,tg.p,' g')}${row('Carbos',tot.c,tg.c,' g')}${row('Grasa',tot.f,tg.f,' g')}</div>`;
}
function kcalSeg(v,t){ const n=20, on=Math.min(n,Math.round(t?v/t*n:0)), over=v>t*1.08;
  return `<div class="kseg"><div class="row between" style="align-items:baseline"><span class="kseg-t">Calorías</span><span class="kseg-v">${fmtN(v,0)}<small> / ${fmtN(t,0)}</small></span></div><div class="kseg-bar" role="img" aria-label="${fmtN(v,0)} de ${fmtN(t,0)} kcal">${Array.from({length:n},(_,i)=>`<i class="${i<on?(over?'over':'on'):''}"></i>`).join('')}</div></div>` }
function sesTitle(name){ const k=name.indexOf('+'); return k<0?esc(name):`${esc(name.slice(0,k).trim())} <span class="acc">${esc(name.slice(k))}</span>` }
function totals(list){ return list.reduce((a,m)=>({kcal:a.kcal+(num(m.kcal)||0),p:a.p+(num(m.p)||0),c:a.c+(num(m.c)||0),f:a.f+(num(m.f)||0)}),{kcal:0,p:0,c:0,f:0}) }

/* ============ TEMPORIZADOR DE DESCANSO ============ */
let timer=null;
function startTimer(sec, next){
  clearInterval(timer&&timer.h); const end=Date.now()+sec*1000; timer={end,total:sec,next:next||'',min:false};
  restNotif(end);
  const tick=()=>{ if(!timer) return; const left=Math.max(0,Math.round((timer.end-Date.now())/1000));
    if(timer.min){
      $('#timerSlot').innerHTML=`<div class="timer ${left===0?'zero':''}" role="timer"><span class="label" style="color:inherit;opacity:.7">Descanso</span><span class="t" data-act="timermax" style="cursor:pointer">${fmtTime(left)}</span><button data-act="plus30">+30 s</button><button data-act="timerstop">${left===0?'Listo':'Saltar'}</button></div>`;
      const nv=document.querySelector('nav.tabs'), tm=$('#timerSlot .timer');
      if(nv&&tm&&getComputedStyle(nv).position==='fixed'){ const top=nv.getBoundingClientRect().top; tm.style.bottom=Math.max(8,window.innerHeight-top+8)+'px' }
    } else {
      const C=2*Math.PI*46, frac=timer.total?Math.min(1,left/timer.total):0;
      const html=`<div class="rest-full ${left===0?'zero':''}" role="timer" aria-label="Descanso"><span class="lbl">${left===0?'¡A por la siguiente!':'Descanso'}</span>
        <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#2A3331" stroke-width="5"/><circle cx="50" cy="50" r="46" fill="none" stroke="#E8574D" stroke-width="5" stroke-linecap="butt" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}" style="transition:stroke-dashoffset .5s linear"/></svg><span class="big">${fmtTime(left)}</span></div>
        ${timer.next?`<p class="next">Siguiente: <b>${esc(timer.next)}</b></p>`:''}

  if(f.id==='fProfile'){ await put('profile','main',{...S.profile, height:num($('#pfH').value)||175,birth:$('#pfB').value||DEFAULT_PROFILE.birth,start:$('#pfS').value||DEFAULT_PROFILE.start,sex:'h'}); toast('Datos guardados'); }
  if(document.activeElement) document.activeElement.blur(); scheduleRender();
});
async function makePDF(btn){
  if(!window.jspdf){ toast('No se pudo cargar el generador de PDF. Recarga la página.'); return }
  let dl=null; try{ dl = await window.claude?.use('downloads') }catch(e){}
  if(!dl){ toast('Las descargas no están disponibles en esta vista'); return }
  btn.disabled=true;
  try{
    const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210, M=14, red=[194,52,44], ink=[19,25,24], mute=[90,102,99], line=[211,217,214];
    doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...ink); doc.text('MENÚ SEMANAL · DESDE EL '+fmtDate(MENU_FROM).toUpperCase(), M, 20);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...mute);
    doc.text(`Menú base: unas ${TARGETS.rest.kcal} kcal y ${TARGETS.rest.p} g de proteína al día. Día de entreno: + 300 kcal (objetivo ${TARGETS.train.kcal} kcal).`, M, 27);
    doc.setFillColor(...red); doc.rect(M,30,W-2*M,0.8,'F');
    const colX=[M, M+26, M+68, M+110, M+146]; const colW=[24,40,40,34,36];
    let y=37;
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...mute);
    ['DÍA','DESAYUNO','COMIDA','MERIENDA','CENA'].forEach((h,i)=>doc.text(h,colX[i],y)); y+=3;
    WEEK.forEach((w,i)=>{
      const cells=[0,1,2,3].map(j=>{const m=weekMeal(i,j); return m.free?{free:true, t:'CENA LIBRE', d:''}:{t:m.t, d:m.d, k:`${m.kcal} kcal · ${m.p} g P`}});
      doc.setFontSize(8.5);
      const parts=cells.map((c,j)=>{ doc.setFont('helvetica','bold'); const t=doc.splitTextToSize(c.t,colW[j+1]); doc.setFont('helvetica','normal'); const d=c.d?doc.splitTextToSize(c.d,colW[j+1]):[]; return {t,d,k:c.k,free:c.free} });
      const h=Math.max(...parts.map(p=>p.t.length*3.8+p.d.length*3.4+(p.k?4:0)))+5;
      doc.setDrawColor(...line); doc.line(M,y,W-M,y); y+=4.5;
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...ink); doc.text(w.d,colX[0],y+0.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...mute); 
      parts.forEach((p,j)=>{ let yy=y; const x=colX[j+1];
        doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(...(p.free?red:ink)); doc.text(p.t,x,yy); yy+=p.t.length*3.8;
        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...mute); if(p.d.length){ doc.text(p.d,x,yy); yy+=p.d.length*3.4 }
        if(p.k){ doc.setTextColor(...ink); doc.text(p.k,x,yy+0.5) } });
      y+=h;
    });
    doc.setDrawColor(...line); doc.line(M,y,W-M,y); y+=7;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...ink); doc.text('NOTAS',M,y); y+=5;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...mute);
    [
     'Cenas libres viernes, sábado y domingo: una ración normal, sin repetir ni picar después.',
     'Agua: 2,5–3 litros al día. Pesos de arroz, pasta y legumbres en crudo.',
     'Día de entreno: añade yogur proteico + fruta + 20 g de frutos secos (unas 300 kcal).',
     'No te saltes la merienda: sin ella te quedas corto de proteína.']
     .forEach(t=>{ doc.text('•  '+t,M,y); y+=4.6 });
    const blob=doc.output('blob');
    await dl.save({filename:'menu-semanal.pdf', data:blob});
    toast('Menú descargado');
  }catch(err){ if(err&&err.code==='declined') toast('Descarga cancelada'); else toast('No se pudo descargar: '+((err&&(err.message||err.code))||'error')) }
  finally{ btn.disabled=false }
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const m=1600/Math.max(bmp.width,bmp.height); const s=Math.min(1,m);
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.85)); }catch(e){ return file }
}
